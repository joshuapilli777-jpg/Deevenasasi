<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>D & S | Deevena & Sasi Preetham</title>

<meta name="description" content="The wedding invitation of Dr. Deevena Salivendra and Dr. Sasi Preetham Manukonda — 23 November 2026.">
<meta name="theme-color" content="#11100e">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>

/* =========================================================
   D & S — MODERN LUXURY WEDDING INVITATION
   ========================================================= */

:root{
  --black:#11100e;
  --black-soft:#171512;
  --black-card:#1d1a16;

  --ivory:#f7f2e9;
  --ivory-soft:#ebe4d8;

  --gold:#c8a96a;
  --gold-light:#e3c98c;
  --gold-dark:#927643;

  --muted:#a9a092;
  --white:#fff;

  --serif:"Cormorant Garamond", Georgia, serif;
  --display:"Playfair Display", Georgia, serif;
  --sans:"DM Sans", Arial, sans-serif;

  --ease:cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  background:var(--black);
}

body{
  background:var(--black);
  color:var(--ivory);
  font-family:var(--sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body.locked{
  overflow:hidden;
}

img{
  max-width:100%;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

button{
  font:inherit;
}

a{
  color:inherit;
}


/* =========================================================
   GLOBAL GRAIN
   ========================================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9990;
  opacity:.035;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
}


/* =========================================================
   CANVAS
   ========================================================= */

#celebrationCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:800;
}


/* =========================================================
   OPENING SCREEN
   ========================================================= */

#open{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:
    linear-gradient(
      180deg,
      rgba(8,7,6,.22),
      rgba(8,7,6,.72)
    ),
    url("template/file_00000000d68c821196531749c17a6a8e.png")
    center/cover no-repeat;

  transition:
    opacity 1.3s var(--ease),
    visibility 1.3s;
}

#open::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      transparent 0%,
      rgba(0,0,0,.38) 75%
    );
}

#open.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.open-inner{
  position:relative;
  z-index:2;

  width:min(90%,700px);

  padding:30px 20px;
}

.open-monogram{
  font-family:var(--display);
  font-size:clamp(64px,14vw,125px);
  line-height:.8;
  font-weight:400;
  letter-spacing:-7px;
  color:var(--ivory);

  text-shadow:
    0 8px 35px rgba(0,0,0,.45);

  animation:openMonogram 1.6s var(--ease) both;
}

@keyframes openMonogram{
  from{
    opacity:0;
    transform:translateY(25px) scale(.92);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.open-line{
  width:90px;
  height:1px;
  margin:32px auto;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold-light),
      transparent
    );

  animation:fadeUp 1.2s .35s var(--ease) both;
}

.open-kicker{
  font-size:10px;
  letter-spacing:5px;
  text-transform:uppercase;
  color:var(--gold-light);

  animation:fadeUp 1.2s .5s var(--ease) both;
}

.open-verse{
  margin:28px auto 8px;

  max-width:600px;

  font-family:var(--serif);
  font-size:clamp(21px,4vw,29px);
  line-height:1.35;
  font-style:italic;

  color:var(--ivory);

  animation:fadeUp 1.2s .65s var(--ease) both;
}

.open-reference{
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold-light);

  animation:fadeUp 1.2s .75s var(--ease) both;
}

.enter-btn{
  margin-top:42px;

  position:relative;
  overflow:hidden;

  border:1px solid rgba(227,201,140,.8);
  background:rgba(0,0,0,.18);

  color:var(--ivory);

  padding:16px 34px;

  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;

  cursor:pointer;

  transition:
    background .35s ease,
    color .35s ease,
    transform .35s var(--ease);

  animation:fadeUp 1.2s .9s var(--ease) both;
}

.enter-btn::before{
  content:"";
  position:absolute;
  inset:0;

  background:var(--gold-light);

  transform:translateX(-105%);
  transition:transform .5s var(--ease);

  z-index:-1;
}

.enter-btn:hover{
  color:var(--black);
  transform:translateY(-3px);
}

.enter-btn:hover::before{
  transform:translateX(0);
}


/* =========================================================
   MUSIC BUTTON
   ========================================================= */

.music-button{
  position:fixed;
  right:22px;
  bottom:22px;

  z-index:700;

  width:54px;
  height:54px;

  border-radius:50%;

  border:1px solid rgba(200,169,106,.55);

  background:rgba(17,16,14,.72);

  backdrop-filter:blur(15px);

  color:var(--gold-light);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  opacity:0;
  visibility:hidden;

  transform:translateY(15px);

  transition:
    opacity .5s ease,
    visibility .5s,
    transform .5s var(--ease);
}

.music-button.show{
  opacity:1;
  visibility:visible;
  transform:none;
}

.music-button.playing{
  box-shadow:
    0 0 0 1px rgba(200,169,106,.25),
    0 0 30px rgba(200,169,106,.15);
}

.music-icon{
  width:20px;
  height:20px;
}

.music-bars{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  height:20px;
}

.music-bars span{
  display:block;
  width:2px;
  height:7px;
  background:var(--gold-light);
}

.music-button.playing .music-bars span:nth-child(1){
  animation:musicBar .8s infinite ease-in-out;
}

.music-button.playing .music-bars span:nth-child(2){
  animation:musicBar .65s .1s infinite ease-in-out;
}

.music-button.playing .music-bars span:nth-child(3){
  animation:musicBar .75s .2s infinite ease-in-out;
}

.music-button.playing .music-bars span:nth-child(4){
  animation:musicBar .6s .15s infinite ease-in-out;
}

@keyframes musicBar{
  0%,100%{height:6px}
  50%{height:17px}
}


/* =========================================================
   SITE
   ========================================================= */

.site{
  display:none;
  background:var(--black);
}

.site.show{
  display:block;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{
  min-height:100svh;

  position:relative;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      rgba(10,9,8,.12) 20%,
      rgba(10,9,8,.12) 40%,
      rgba(10,9,8,.92) 100%
    ),
    url("template/file_00000000d68c821196531749c17a6a8e.png")
    center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at center,
      transparent 20%,
      rgba(0,0,0,.32) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;

  width:min(1100px,92%);

  padding:
    0
    0
    clamp(55px,9vw,100px);
}

.hero-small{
  font-size:10px;
  letter-spacing:5px;
  text-transform:uppercase;

  color:var(--gold-light);

  margin-bottom:25px;

  opacity:0;
  transform:translateY(25px);
}

.hero.loaded .hero-small{
  animation:fadeUp 1s .15s var(--ease) forwards;
}

.hero-names{
  font-family:var(--display);

  font-size:clamp(58px,10vw,145px);

  line-height:.78;

  font-weight:400;

  letter-spacing:-5px;

  color:var(--ivory);

  text-shadow:
    0 10px 40px rgba(0,0,0,.3);

  opacity:0;
  transform:translateY(35px);
}

.hero.loaded .hero-names{
  animation:fadeUp 1.4s .3s var(--ease) forwards;
}

.hero-names .weds{
  display:block;

  margin:
    24px 0
    18px;

  font-family:var(--serif);

  font-size:clamp(21px,3vw,34px);

  font-style:italic;

  letter-spacing:4px;

  color:var(--gold-light);
}

.hero-date{
  margin-top:38px;

  display:flex;
  align-items:center;
  gap:14px;

  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:var(--ivory-soft);

  opacity:0;
}

.hero.loaded .hero-date{
  animation:fadeUp 1s .65s var(--ease) forwards;
}

.hero-date-line{
  width:45px;
  height:1px;
  background:var(--gold);
}

.scroll-indicator{
  position:absolute;
  bottom:28px;
  right:35px;

  z-index:3;

  writing-mode:vertical-rl;

  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:rgba(247,242,233,.6);

  display:flex;
  align-items:center;
  gap:12px;
}

.scroll-indicator::after{
  content:"";
  display:block;

  width:1px;
  height:55px;

  background:
    linear-gradient(
      var(--gold),
      transparent
    );

  animation:scrollLine 2s infinite;
}

@keyframes scrollLine{
  0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}
}


/* =========================================================
   COMMON SECTIONS
   ========================================================= */

.section{
  position:relative;

  padding:
    clamp(90px,12vw,170px)
    6vw;

  overflow:hidden;
}

.section-inner{
  width:min(1100px,100%);
  margin:auto;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:14px;

  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:var(--gold);

  margin-bottom:22px;
}

.eyebrow::before{
  content:"";
  width:35px;
  height:1px;
  background:var(--gold);
}

.section-title{
  font-family:var(--display);

  font-weight:400;

  font-size:clamp(45px,7vw,85px);

  line-height:.95;

  letter-spacing:-2px;

  color:var(--ivory);
}

.section-title em{
  font-weight:400;
  color:var(--gold-light);
}

.section-description{
  max-width:600px;

  margin-top:28px;

  font-family:var(--serif);

  font-size:clamp(20px,2.5vw,27px);

  line-height:1.5;

  color:var(--ivory-soft);
}

.gold-line{
  width:70px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      transparent
    );

  margin:35px 0;
}


/* =========================================================
   INTRO / VERSE
   ========================================================= */

.intro{
  min-height:75svh;

  display:flex;
  align-items:center;

  background:
    radial-gradient(
      circle at 70% 50%,
      rgba(200,169,106,.09),
      transparent 45%
    ),
    var(--black);
}

.intro-content{
  width:min(900px,100%);
  margin:auto;
  text-align:center;
}

.intro .eyebrow{
  justify-content:center;
}

.intro .eyebrow::before{
  display:none;
}

.intro-verse{
  font-family:var(--serif);

  font-size:clamp(30px,5vw,58px);

  line-height:1.12;

  font-style:italic;

  color:var(--ivory);

  margin-top:35px;
}

.intro-reference{
  margin-top:28px;

  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:var(--gold);
}


/* =========================================================
   OUR STORY
   ========================================================= */

.story{
  background:
    linear-gradient(
      180deg,
      var(--black-soft),
      var(--black)
    );
}

.story-heading{
  text-align:center;
  margin-bottom:100px;
}

.story-heading .eyebrow{
  justify-content:center;
}

.story-heading .eyebrow::before{
  display:none;
}

.story-grid{
  position:relative;

  width:min(1000px,100%);
  margin:auto;
}

.story-grid::before{
  content:"";

  position:absolute;

  top:0;
  bottom:0;
  left:50%;

  width:1px;

  background:
    linear-gradient(
      transparent,
      rgba(200,169,106,.6),
      transparent
    );
}

.story-item{
  position:relative;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:70px;

  margin-bottom:130px;

  align-items:center;
}

.story-item:last-child{
  margin-bottom:0;
}

.story-item:nth-child(even) .story-image{
  order:2;
}

.story-item:nth-child(even) .story-text{
  order:1;
  text-align:right;
}

.story-image{
  position:relative;

  overflow:hidden;

  aspect-ratio:4/5;

  background:#222;

  border-radius:2px;
}

.story-image::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      transparent 50%,
      rgba(0,0,0,.25)
    );
}

.story-image img{
  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform 1.2s var(--ease);
}

.story-item:hover .story-image img{
  transform:scale(1.045);
}

.story-text{
  position:relative;
}

.story-number{
  font-size:10px;
  letter-spacing:3px;
  color:var(--gold);

  margin-bottom:15px;
}

.story-text h3{
  font-family:var(--display);

  font-size:clamp(35px,4vw,52px);

  font-weight:400;

  color:var(--ivory);

  margin-bottom:20px;
}

.story-text p{
  font-family:var(--serif);

  font-size:21px;
  line-height:1.55;

  color:var(--muted);
}

.story-dot{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:11px;
  height:11px;

  border-radius:50%;

  background:var(--gold);

  box-shadow:
    0 0 0 6px var(--black-soft),
    0 0 22px rgba(200,169,106,.4);
}


/* =========================================================
   COUPLE
   ========================================================= */

.couple-section{
  background:var(--ivory);
  color:var(--black);
}

.couple-section .eyebrow{
  color:var(--gold-dark);
}

.couple-section .eyebrow::before{
  background:var(--gold-dark);
}

.couple-section .section-title{
  color:var(--black);
}

.couple-section .section-title em{
  color:var(--gold-dark);
}

.couple-intro{
  max-width:700px;
  margin-bottom:90px;
}

.person-block{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  min-height:620px;

  margin-bottom:2px;
}

.person-block.reverse .person-photo{
  order:2;
}

.person-block.reverse .person-info{
  order:1;
}

.person-photo{
  overflow:hidden;
  min-height:500px;
}

.person-photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  transition:transform 1.5s var(--ease);
}

.person-block:hover .person-photo img{
  transform:scale(1.035);
}

.person-info{
  padding:clamp(45px,7vw,100px);

  display:flex;
  flex-direction:column;
  justify-content:center;

  background:#eee7dc;
}

.person-label{
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;

  color:var(--gold-dark);

  margin-bottom:20px;
}

.person-name{
  font-family:var(--display);

  font-size:clamp(45px,5vw,72px);

  line-height:.98;

  font-weight:400;

  color:var(--black);

  margin-bottom:25px;
}

.person-parents{
  font-family:var(--serif);

  font-size:21px;
  line-height:1.5;

  color:#625b52;

  max-width:450px;
}


/* =========================================================
   DATE
   ========================================================= */

.date-section{
  min-height:100svh;

  display:flex;
  align-items:center;

  text-align:center;

  background:
    radial-gradient(
      circle at center,
      rgba(200,169,106,.11),
      transparent 48%
    ),
    var(--black);
}

.date-content{
  width:100%;
}

.date-section .eyebrow{
  justify-content:center;
}

.date-section .eyebrow::before{
  display:none;
}

.date-big{
  font-family:var(--display);

  font-size:clamp(115px,22vw,290px);

  line-height:.72;

  font-weight:400;

  letter-spacing:-10px;

  color:var(--ivory);

  margin:60px 0 35px;

  text-shadow:
    0 0 70px rgba(200,169,106,.08);
}

.date-month{
  font-family:var(--serif);

  font-size:clamp(30px,5vw,60px);

  letter-spacing:7px;

  text-transform:uppercase;

  color:var(--gold-light);
}

.date-year{
  margin-top:15px;

  font-size:10px;

  letter-spacing:6px;

  color:var(--muted);
}

.date-time{
  margin-top:45px;

  font-family:var(--serif);

  font-size:24px;

  color:var(--ivory-soft);
}


/* =========================================================
   ALBUM
   ========================================================= */

.album-section{
  background:var(--black-soft);
}

.album-header{
  width:min(1000px,100%);
  margin:auto;

  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  gap:30px;

  margin-bottom:55px;
}

.album-header-text{
  max-width:600px;
}

.album-counter{
  color:var(--gold);
  font-size:10px;
  letter-spacing:3px;
  white-space:nowrap;
}

.album-viewport{
  width:100%;

  position:relative;
}

.album-container{
  display:flex;

  gap:24px;

  overflow-x:auto;

  padding:
    15px
    5vw
    45px;

  scroll-snap-type:x mandatory;

  scrollbar-width:none;

  cursor:grab;

  -webkit-overflow-scrolling:touch;
}

.album-container::-webkit-scrollbar{
  display:none;
}

.album-container.dragging{
  cursor:grabbing;
  scroll-snap-type:none;
}

.album-page{
  flex:0 0 clamp(280px,34vw,430px);

  aspect-ratio:3/4;

  scroll-snap-align:center;

  position:relative;

  overflow:hidden;

  background:#222;

  cursor:pointer;
}

.album-page img{
  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform 1s var(--ease),
    filter .5s ease;
}

.album-page:hover img{
  transform:scale(1.05);
  filter:brightness(.82);
}

.album-overlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  padding:22px;

  background:
    linear-gradient(
      transparent 60%,
      rgba(0,0,0,.55)
    );

  pointer-events:none;
}

.album-number{
  font-size:9px;
  letter-spacing:3px;
  color:#fff;
}

.album-view{
  font-size:9px;
  letter-spacing:2px;
  color:var(--gold-light);
}

.album-controls{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:20px;
}

.album-btn{
  width:46px;
  height:46px;

  border-radius:50%;

  border:1px solid rgba(200,169,106,.5);

  background:transparent;

  color:var(--gold-light);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  transition:
    background .3s ease,
    color .3s ease,
    transform .3s var(--ease);
}

.album-btn:hover{
  background:var(--gold);
  color:var(--black);
  transform:scale(1.06);
}

.album-hint{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

.countdown-section{
  background:var(--ivory);
  color:var(--black);

  text-align:center;
